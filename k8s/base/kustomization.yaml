# kubectl apply -k k8s/base   (Kustomize viene integrado en kubectl; no requiere Helm)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: solarbi
labels:
  - pairs: {app.kubernetes.io/part-of: solarbi}
    includeSelectors: false
resources:
  - 00-namespace.yaml
  - 10-postgres.yaml
  - 20-grafana.yaml
  - 30-etl-job.yaml
  - 40-simulador-cronjob.yaml
# El sufijo hash de cada ConfigMap generado cambia con su contenido -> al editar un umbral
# y re-aplicar, Kubernetes hace rolling update de Grafana sin reconstruir imágenes.
configMapGenerator:
  - name: solarbi-config
    literals:
      - SOLARBI_PG_HOST=postgres          # nombre del Service, nunca una IP
      - SOLARBI_PG_DB=solarbi
      - SOLARBI_ETL_USER=solarbi_etl
      - SOLARBI_PG_READER_USER=solarbi_reader
      - SQLITE_PATH=/data/opencem-v1.0.0.sqlite
      - CHUNK_ROWS=250000
      - CALCULAR_SHA=1
      - REPLAY_DESDE=2026-03-10T08:00:00+08:00
      - REPLAY_DIAS=7
      - DT_MAX_S=120
      - ANOMALIA_PROB=0.05
      - FORZAR_ANOMALIA=
      - ALERTA_SOC_MIN=20
      - ALERTA_FRESCURA_S=300
      - ALERTA_PCT_VALIDAS=90
  - name: postgres-init
    files: [01-roles.sh=postgres-init.sh]
  - name: grafana-datasource
    files: [grafana/datasource.yaml]
  - name: grafana-dashboard-provider
    files: [grafana/dashboard-provider.yaml]
  - name: grafana-alert-rules
    files: [grafana/alert-rules.yaml]
  - name: grafana-dashboard-json
    files: [grafana/solarbi-operativo.json]
