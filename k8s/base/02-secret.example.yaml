# PLANTILLA (la única versión que vive en Git). El Secret real se crea con
#   make secret   ->  kubectl create secret generic solarbi-secret --from-env-file=.env
# a partir de .env (ignorado por .gitignore). Nunca se aplica este archivo con valores reales.
apiVersion: v1
kind: Secret
metadata:
  name: solarbi-secret
  namespace: solarbi
type: Opaque
stringData:
  POSTGRES_PASSWORD: "cambiar-superusuario"       # superusuario, solo para initdb
  SOLARBI_ETL_PASSWORD: "cambiar-etl"             # dueño del modelo (Job ETL, CronJob simulador)
  SOLARBI_PG_READER_PASSWORD: "cambiar-lector"    # solo lectura (Grafana, Power BI, DBeaver)
  GF_SECURITY_ADMIN_PASSWORD: "cambiar-grafana"
