# Grafana: Deployment sin PVC a propósito. Fuente de datos, tablero y alertas se
# aprovisionan desde ConfigMaps al arrancar -> el pod es desechable (demostración K.4).
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: http, nodePort: 30300}]   # k3d: -p 3000:30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # sin corte al cambiar configuración
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext: {runAsUser: 472, fsGroup: 472, runAsNonRoot: true}
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2            # versión fija
          ports: [{name: http, containerPort: 3000}]
          envFrom:
            - configMapRef: {name: solarbi-config}  # SOLARBI_PG_*, ALERTA_* (umbrales)
          env:
            - {name: SOLARBI_PG_READER_PASSWORD, valueFrom: {secretKeyRef: {name: solarbi-secret, key: SOLARBI_PG_READER_PASSWORD}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: solarbi-secret, key: GF_SECURITY_ADMIN_PASSWORD}}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/solarbi-operativo.json}
          volumeMounts:
            - {name: ds,     mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: prov,   mountPath: /etc/grafana/provisioning/dashboards,  readOnly: true}
            - {name: alert,  mountPath: /etc/grafana/provisioning/alerting,    readOnly: true}
            - {name: tablero, mountPath: /var/lib/grafana/dashboards,          readOnly: true}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits:   {cpu: 500m, memory: 512Mi}
      volumes:
        - {name: ds,      configMap: {name: grafana-datasource}}
        - {name: prov,    configMap: {name: grafana-dashboard-provider}}
        - {name: alert,   configMap: {name: grafana-alert-rules}}
        - {name: tablero, configMap: {name: grafana-dashboard-json}}
