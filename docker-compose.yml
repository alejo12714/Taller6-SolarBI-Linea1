# Desarrollo local (paso previo al clúster). Mismas imágenes, mismos archivos de aprovisionamiento.
#   cp .env.example .env && docker compose up -d postgres grafana
#   docker compose run --rm etl            # carga histórica
#   docker compose up -d simulador         # streaming cada 60 s
name: solarbi
x-config: &config
  SOLARBI_PG_HOST: postgres
  SOLARBI_PG_DB: solarbi
  SOLARBI_ETL_USER: solarbi_etl
  SOLARBI_PG_READER_USER: solarbi_reader
  ALERTA_SOC_MIN: "20"
  ALERTA_FRESCURA_S: "300"
  ALERTA_PCT_VALIDAS: "90"
x-pg-etl: &pgetl
  PGHOST: postgres
  PGDATABASE: solarbi
  PGUSER: solarbi_etl
  PGPASSWORD: ${SOLARBI_ETL_PASSWORD}
services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      <<: *config
      POSTGRES_USER: postgres
      POSTGRES_DB: solarbi
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./k8s/base/postgres-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solarbi"]
      interval: 5s
      retries: 10
  grafana:
    image: grafana/grafana:11.2.2
    environment:
      <<: *config
      SOLARBI_PG_READER_PASSWORD: ${SOLARBI_PG_READER_PASSWORD}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./k8s/base/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./k8s/base/grafana/dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/dashboard-provider.yaml:ro
      - ./k8s/base/grafana/alert-rules.yaml:/etc/grafana/provisioning/alerting/alert-rules.yaml:ro
      - ./k8s/base/grafana/solarbi-operativo.json:/var/lib/grafana/dashboards/solarbi-operativo.json:ro
    depends_on:
      postgres: {condition: service_healthy}
  etl:
    build: {context: ., dockerfile: etl/Dockerfile}
    image: solarbi-etl:1.0.0
    environment:
      <<: *pgetl
      SQLITE_PATH: /data/opencem-v1.0.0.sqlite
    volumes: ["./data:/data:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["batch"]
  simulador:
    build: {context: ., dockerfile: simulator/Dockerfile}
    image: solarbi-simulator:1.0.0
    environment:
      <<: *pgetl
      ANOMALIA_PROB: "0.05"
    entrypoint: ["sh", "-c", "while true; do python -u simulator/simulador.py; sleep 60; done"]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["stream"]
volumes:
  pgdata:
